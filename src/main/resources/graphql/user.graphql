type User {
    id: ID!
    username: String!
    email: String!
}

input CreateUserInput {
    username: String!
    email: String!
    password: String!
}

input UpdateUserInput {
    username: String
    email: String
    password: String
}

type Query {
    allUsers: [User]
    userById(id: ID!): User!
}

type Mutation {
    createUser(input: CreateUserInput): User
    updateUser(id: ID!, input: UpdateUserInput): User!
    deleteUser(id: String): ID!
}
